[package]
name = "allreads-core"
description = "Domain logic for Allreads: books, text, vocabulary and storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rbook = "0.7.13"
refinery = { version = "0.9.2", features = ["rusqlite"] }
regex = "1.13.2"
rusqlite = { version = "0.39", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.20"
toml = "1.2.2"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.2", features = ["json"] }

[features]
# Exposes test helpers (a local mock HTTP server) to other crates' tests.
test-support = []

[lints]
workspace = true

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
tempfile = "3.27.0"

[[bench]]
name = "open_chapter"
harness = false
