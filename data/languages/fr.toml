# Language preset: French. Ported from Lukaisu (MIT), see NOTICE.
name = "French"
code = "fr"
word_characters = "a-zA-ZÀ-ÖØ-öø-ȳ"
sentence_end_chars = ".!?:;"
sentence_exceptions = "[A-Z].|Dr."
character_substitutions = "´='|`='|’='|‘='|...=…|..=‥"
rtl = false
remove_spaces = false
split_each_char = false
tts_locale = "fr-FR"
dictionary_url = "http://www.wordreference.com/fren/{term}"
translator_url = "https://translate.google.com/?ie=UTF-8&sl=fr&tl=en&text={term}"
# Split before an apostrophe: l'homme, jusqu'à. Not aujourd'hui.
elision_prefixes = "l|d|j|m|n|s|t|c|qu|jusqu|lorsqu|puisqu|quoiqu"
# Articles stripped from the start of imported words ("le chat" → "chat").
articles = "le|la|les|l'|un|une|des|du|de la"
