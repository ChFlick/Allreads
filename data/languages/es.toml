# Language preset: Spanish. Ported from Lukaisu (MIT), see NOTICE.
name = "Spanish"
code = "es"
# The full Latin range, so loanwords like "Café" or "naïv" stay whole.
word_characters = "a-zA-ZÀ-ÖØ-öø-ȳẞ"
sentence_end_chars = ".!?:;¿¡"
sentence_exceptions = "[A-Z].|Sr.|Sra.|Dr."
character_substitutions = "´='|`='|’='|‘='|...=…|..=‥"
rtl = false
remove_spaces = false
split_each_char = false
tts_locale = "es-ES"
dictionary_url = "https://es.wiktionary.org/wiki/{term}"
translator_url = "https://translate.google.com/?ie=UTF-8&sl=es&tl=en&text={term}"
# Articles stripped from the start of imported words ("le chat" → "chat").
articles = "el|la|los|las|un|una|unos|unas|lo"
