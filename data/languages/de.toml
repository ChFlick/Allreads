# Language preset: German. Ported from Lukaisu (MIT), see NOTICE.
name = "German"
code = "de"
# The full Latin range, so loanwords like "Café" or "naïv" stay whole.
word_characters = "a-zA-ZÀ-ÖØ-öø-ȳẞ"
sentence_end_chars = ".!?:;"
sentence_exceptions = "[A-Z].|Dr."
character_substitutions = "´='|`='|’='|‘='|...=…|..=‥"
rtl = false
remove_spaces = false
split_each_char = false
tts_locale = "de-DE"
dictionary_url = "http://de-en.syn.dict.cc/?s={term}"
translator_url = "https://translate.google.com/?ie=UTF-8&sl=de&tl=en&text={term}"
