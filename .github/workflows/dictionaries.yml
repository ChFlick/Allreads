name: Dictionaries

# Builds the offline dictionaries from kaikki.org's Wiktionary extracts, adds
# word frequencies for the vocabulary check (Lexique 3 for French,
# FrequencyWords for other languages), and uploads them, with a manifest the
# app reads, to the `dictionaries` release.
# Run by hand from the Actions tab; Wiktionary changes slowly.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Space-separated language codes with a kaikki.org extract and a preset"
        default: "fr"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build dictgen
        run: cargo build --release --locked -p allreads-dictgen

      - name: Build the dictionaries
        env:
          LANGUAGES: ${{ inputs.languages }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          built="$(date -u +%Y-%m-%d)"
          for code in $LANGUAGES; do
            case "$code" in
              fr) name=French ;; de) name=German ;; es) name=Spanish ;;
              *) echo "No kaikki.org name known for $code" >&2; exit 1 ;;
            esac
            curl -fsSL --retry 3 -o "extract-$code.jsonl.gz" \
              "https://kaikki.org/dictionary/$name/kaikki.org-dictionary-$name.jsonl.gz"
            # Word frequencies: Lexique 3 for French (CC BY-SA 4.0), else
            # FrequencyWords' 50,000 most common words (CC BY-SA 4.0).
            if [ "$code" = fr ]; then
              curl -fsSL --retry 3 -o lexique.zip https://www.lexique.org/databases/Lexique383/Lexique383.zip
              unzip -p lexique.zip Lexique383/Lexique383.tsv > "frequencies-$code.txt"
              source=lexique
            else
              curl -fsSL --retry 3 -o "frequencies-$code.txt" \
                "https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2018/$code/${code}_50k.txt"
              source=frequencywords
            fi
            target/release/allreads-dictgen --input "extract-$code.jsonl.gz" --language "$code" \
              --output "out/$code-en.sqlite" --built "$built" \
              --frequencies "frequencies-$code.txt" --frequency-source "$source"
            gzip -9 "out/$code-en.sqlite" --keep
          done
          # Keep the book lists ("catalogs") the published manifest already lists.
          # Only a first run (no release yet) starts empty; a failed download stops
          # the run rather than publish a manifest without the book lists.
          if gh release view dictionaries >/dev/null 2>&1; then
            gh release download dictionaries --pattern dictionaries.json --output published.json
          else
            echo '{}' > published.json
          fi
          python3 - "$built" $LANGUAGES <<'PY'
          import hashlib, json, os, sys
          built, codes = sys.argv[1], sys.argv[2:]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/dictionaries"
          entries = []
          for code in codes:
              gz = f"out/{code}-en.sqlite.gz"
              entries.append({
                  "pair": f"{code}-en",
                  "language": code,
                  "url": f"{base}/{code}-en.sqlite.gz",
                  "built": built,
                  "download_bytes": os.path.getsize(gz),
                  "installed_bytes": os.path.getsize(f"out/{code}-en.sqlite"),
                  "sha256": hashlib.sha256(open(gz, "rb").read()).hexdigest(),
                  # The word-frequency source added by dictgen, for the vocabulary check.
                  "frequencies": "Lexique 3" if code == "fr" else "FrequencyWords",
              })
          catalogs = json.load(open("published.json")).get("catalogs", [])
          json.dump({"format": 1, "dictionaries": entries, "catalogs": catalogs}, open("out/dictionaries.json", "w"), indent=2)
          PY
          cat out/dictionaries.json

      - name: Publish to the dictionaries release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view dictionaries >/dev/null 2>&1; then
            gh release create dictionaries --title "Offline dictionaries" --latest=false \
              --notes "Offline dictionaries for Allreads, downloaded from the app's Settings. Built from Wiktionary data via kaikki.org, licensed CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)."
          fi
          # GitHub's upload server fails now and then; retry each file. The
          # manifest goes last, so it never points at a file that is missing.
          upload() {
            for attempt in 1 2 3 4 5; do
              gh release upload dictionaries "$1" --clobber && return 0
              echo "Upload of $1 failed (attempt $attempt); retrying" >&2
              sleep $((attempt * 10))
            done
            return 1
          }
          gh release edit dictionaries --notes "Offline dictionaries for Allreads, downloaded from the app's Settings. Built from Wiktionary data via kaikki.org; word frequencies from Lexique 3 (New, Pallier et al.) for French and FrequencyWords (Hermit Dave, from OpenSubtitles 2018) for other languages. All licensed CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)."
          for file in out/*.sqlite.gz; do upload "$file"; done
          upload out/dictionaries.json
