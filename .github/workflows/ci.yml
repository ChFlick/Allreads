name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, docs, test, bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Generate Kotlin bindings
        run: |
          cargo build -p allreads-ffi --locked
          cargo run -p allreads-ffi --locked --bin uniffi-bindgen -- \
            generate --library target/debug/liballreads_ffi.so \
            --language kotlin --out-dir target/bindings

  msrv:
    name: Minimum supported Rust (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      - name: Test on 1.91
        run: cargo test --workspace --locked

  android-libs:
    name: Android libraries (cargo-ndk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Show the preinstalled NDK
        run: |
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_NDK_LATEST_HOME"

      - name: Build for arm64-v8a, armeabi-v7a and x86_64 (API 26)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk --platform 26 -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o target/jniLibs build --release --locked -p allreads-ffi

      - name: Check all three libraries exist
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            ls -la "target/jniLibs/$abi/liballreads_ffi.so"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: jniLibs
          path: target/jniLibs
