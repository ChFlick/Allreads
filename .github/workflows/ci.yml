name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, docs, test, bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Generate Kotlin bindings
        run: |
          cargo build -p allreads-ffi --locked
          cargo run -p allreads-ffi --locked --bin uniffi-bindgen -- \
            generate --library target/debug/liballreads_ffi.so \
            --language kotlin --out-dir target/bindings

  msrv:
    name: Minimum supported Rust (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      - name: Test on 1.91
        run: cargo test --workspace --locked

  android:
    name: Android app (APK, Rust libraries, Kotlin tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Gradle runs cargo-ndk (three ABIs, API 26), generates the Kotlin
      # bindings, builds the APK, and runs the Kotlin tests against the host
      # build of the Rust library.
      - name: Build the APK and run the Kotlin tests
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Check the APK holds the Rust library for all three ABIs
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep liballreads_ffi.so
          test "$(unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -c liballreads_ffi.so)" -eq 3

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
