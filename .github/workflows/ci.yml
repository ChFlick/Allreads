name: CI

on:
  push:
    branches: [main, "feature/**"]
    # A tag like preview-find-books-1 publishes that commit as a preview release.
    tags: ["preview-*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, docs, test, bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Docs (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Generate Kotlin bindings
        run: |
          cargo build -p allreads-ffi --locked
          cargo run -p allreads-ffi --locked --bin uniffi-bindgen -- \
            generate --library target/debug/liballreads_ffi.so \
            --language kotlin --out-dir target/bindings

  msrv:
    name: Minimum supported Rust (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      - name: Test on 1.91
        run: cargo test --workspace --locked

  android:
    name: Android app (APK, Rust libraries, Kotlin tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      # cargo-ndk is built once per version and then restored from the cache.
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-ndk*
          key: cargo-ndk-4.1.2-${{ runner.os }}

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked --version 4.1.2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Gradle runs cargo-ndk (three ABIs, API 26), generates the Kotlin
      # bindings, builds the APK, and runs the Kotlin tests against the host
      # build of the Rust library.
      - name: Build the APK, run the Kotlin tests and lint
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export ALLREADS_BUILD_NUMBER="${{ github.run_number }}"
          # Feature branches and preview tags build "Allreads Preview", which
          # installs next to the normal app with its own data.
          case "$GITHUB_REF" in
            refs/heads/feature/*) export ALLREADS_PREVIEW="${GITHUB_REF_NAME#feature/}" ;;
            refs/tags/preview-*) export ALLREADS_PREVIEW="${GITHUB_REF_NAME#preview-}" ;;
          esac
          if [ -n "${ALLREADS_PREVIEW:-}" ]; then
            ALLREADS_PREVIEW="$(printf '%s' "$ALLREADS_PREVIEW" | tr -c 'a-zA-Z0-9' '-' | tr 'A-Z' 'a-z')"
          fi
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon

      - name: Check the APK holds the Rust library for all three ABIs
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep liballreads_ffi.so
          test "$(unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -c liballreads_ffi.so)" -eq 3

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Every push to main that passes all checks becomes a GitHub release with
  # the APK attached. It is the debug build, signed with the fixed key in
  # android/app, so each release installs over the previous one.
  release:
    name: GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, msrv, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: app-debug-apk

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="v${version}-build.${{ github.run_number }}"
          apk="allreads-${version}-build.${{ github.run_number }}.apk"
          mv app-debug.apk "$apk"
          git log -1 --format='%B' > notes.md
          gh release create "$tag" "$apk" \
            --target "${{ github.sha }}" \
            --title "Allreads ${version} (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --prerelease

  # A pushed tag like preview-find-books-1 becomes a preview pre-release of
  # that commit: "Allreads Preview", which installs next to the normal app
  # with its own data. Plain feature-branch pushes only keep the APK as a
  # workflow artifact.
  preview:
    name: Preview release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/preview-')
    needs: [rust, msrv, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: app-debug-apk

      - name: Create the preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          apk="allreads-${tag}.apk"
          mv app-debug.apk "$apk"
          {
            echo "A preview build. It installs next to Allreads as \"Allreads Preview\", with its own library and words; it uses the same AnkiDroid cards."
            echo
            git log -1 --format='%B'
          } > notes.md
          gh release create "$tag" "$apk" \
            --verify-tag \
            --title "Preview: ${tag#preview-}" \
            --notes-file notes.md \
            --prerelease --latest=false
