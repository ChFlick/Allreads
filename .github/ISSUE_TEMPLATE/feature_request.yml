name: Idea or feature request
description: Suggest something that would make reading or learning better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to do while reading or learning, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could Allreads help? Other apps that do it well are useful pointers.
  - type: input
    id: language
    attributes:
      label: Languages you read in
      placeholder: e.g. French, from English
